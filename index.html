<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 天穿戴甲品牌帳號啟動包｜RVEA 精簡版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F0E6; --paper:#FFFCF6; --ink:#3B2A20; --ink2:#6B5546; --mute:#9A8676;
  --line:#E6D9C7; --beige:#E9DCC8; --beige2:#D8C4A8; --accent:#7A5A44; --ok:#5E7A55; --warn:#A8613A;
  --r:16px; --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
header.top{padding:40px 0 8px;text-align:center}
.eyebrow{letter-spacing:.28em;font-size:12px;color:var(--accent);font-weight:500}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,6vw,38px);line-height:1.35;margin:10px 0 8px}
h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;line-height:1.4}
h3{font-family:var(--serif);font-size:18px;margin:28px 0 10px}
.sub{color:var(--ink2);margin:0}
.meta{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 0}
.pill{border:1px solid var(--beige2);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink2);background:var(--paper)}
.progress{margin:26px auto 0;max-width:420px}
.bar{height:6px;background:var(--beige);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.progress small{display:block;text-align:center;color:var(--ink2);margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--beige2)}
.btn.ghost:hover{background:var(--paper)}
.btn.sm{padding:6px 14px;font-size:14px}
.mini{border:1px solid var(--beige2);background:var(--paper);border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.note{background:var(--paper);border:1px dashed var(--beige2);border-radius:12px;padding:12px 16px;color:var(--ink2);font-size:14px;margin:18px 0}
.note b{color:var(--ink)}
.warn{border-color:#E2B394;background:#FFF6EF;color:#7B4A2C}
/* home cards */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:26px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s;position:relative}
.day:hover{transform:translateY(-2px);border-color:var(--beige2)}
.day .n{font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:var(--accent)}
.day .t{font-family:var(--serif);font-size:19px;font-weight:700;margin:4px 0 6px;line-height:1.45}
.day .o{font-size:14px;color:var(--ink2)}
.day .st{position:absolute;top:16px;right:16px;font-size:12px;border-radius:999px;padding:1px 10px;border:1px solid var(--beige2);color:var(--mute)}
.day.done{border-color:var(--ok)}
.day.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.day.key .o::after{content:" ・重點日";color:var(--warn)}
/* day view */
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:20px 0 4px;flex-wrap:wrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px 24px;margin-top:10px}
.goal{background:var(--bg);border-radius:12px;padding:14px 16px;margin:16px 0}
.goal b{display:block;font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:500}
ol.steps{padding-left:22px;margin:8px 0 0;color:var(--ink2)}
ol.steps li{margin:3px 0}
.sec{border-top:1px solid var(--line);margin-top:26px;padding-top:4px}
.sec-t{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;margin:20px 0 12px;font-weight:700}
.sec-t span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;font-family:var(--sans)}
.field{display:block;margin:0 0 18px}
.lb{display:block;font-weight:500;margin-bottom:6px}
.lb em{font-style:normal;font-weight:400;font-size:13px;color:var(--mute)}
.field small,.out small{display:block;color:var(--mute);font-size:13px;margin-top:5px;line-height:1.6}
input[type=text],textarea,select{width:100%;border:1px solid var(--beige2);background:#fff;border-radius:10px;padding:10px 12px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,90,68,.12)}
textarea{resize:vertical;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--beige2);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;line-height:1.4}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:6px 0 16px}
.check input{width:18px;height:18px;margin-top:4px;accent-color:var(--ink)}
.gen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.out{margin:16px 0}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:500}
.out-tools{display:flex;gap:8px;align-items:center}
.cnt{font-size:12px;color:var(--mute)}
.cnt.over{color:#B3261E;font-weight:700}
.out textarea{background:#FFFDF9}
.list{margin:6px 0;padding-left:20px}
.list li{margin:3px 0}
.okc{color:var(--ok)} .ngc{color:#B3261E}
.complete{margin-top:30px;padding:18px;border-radius:14px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.complete .check{margin:0;font-weight:500}
/* topics */
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:#fff}
.tcard.fav{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,90,68,.08)}
.tcard .tt{font-weight:700;font-family:var(--serif);font-size:17px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--bg);color:var(--ink2)}
.tag.c{background:var(--ink);color:var(--paper)}
.tdet{font-size:14px;color:var(--ink2);margin-top:6px}
.tdet b{color:var(--ink);font-weight:500}
.tact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
details.lib{margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--bg)}
details.lib summary{cursor:pointer;font-weight:500}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow:last-child{border:0}
/* flow */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:12px 0}
.fstep{flex:1 1 130px;background:#fff;border:1px solid var(--beige2);border-radius:12px;padding:10px 12px;font-size:14px;position:relative}
.fstep b{display:block;font-family:var(--serif);font-size:15px}
.fstep i{font-style:normal;color:var(--accent);font-size:12px;letter-spacing:.1em}
/* checklist */
table.cl{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
table.cl th,table.cl td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:middle}
table.cl th{font-size:13px;color:var(--mute);font-weight:500}
table.cl td.c{text-align:center;white-space:nowrap}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;display:inline-block}
.badge.y{background:#E6EFE1;color:var(--ok)} .badge.n{background:#F4E9E1;color:var(--warn)}
/* result card */
.card{background:#fff;border:1px solid var(--beige2);border-radius:18px;padding:28px 24px}
.card .ch{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:10px}
.card .ch h2{font-size:26px}
.cs{margin:16px 0;break-inside:avoid}
.cs h4{font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--accent);margin:0 0 6px;border-left:3px solid var(--beige2);padding-left:10px}
.cs .pre{white-space:pre-wrap;font-size:14px;line-height:1.75}
.kw{display:flex;gap:8px;flex-wrap:wrap}
.kw span{border:1px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:14px}
.empty{color:var(--mute);font-size:14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:40px;letter-spacing:.08em}
#printArea{display:none}
@media (max-width:640px){
  .panel{padding:22px 16px}
  .grid2{grid-template-columns:1fr}
  .card{padding:20px 14px}
  table.cl{font-size:14px}
}
@page{size:A4 landscape;margin:12mm}
@media print{
  html,body{background:#fff}
  #app,#toast,header.top,footer{display:none!important}
  #printArea{display:block}
  #printArea .card{border:0;padding:0;border-radius:0}
  #printArea .cols{column-count:2;column-gap:12mm}
  .cs .pre{font-size:11.5pt}
  body{font-size:11.5pt}
}
details.tcard summary::-webkit-details-marker{display:none}
.btn.gen-btn{background:linear-gradient(135deg,#E7A99A 0%,#D98C7E 55%,#C97B8E 100%);border-color:transparent;color:#fff;font-weight:700;padding:12px 24px;box-shadow:0 6px 16px rgba(201,123,142,.28);letter-spacing:.04em;transition:transform .15s,box-shadow .15s}
.btn.gen-btn::before{content:"✦ ";}
.btn.gen-btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 8px 20px rgba(201,123,142,.36)}
.btn.gen-btn:active{transform:scale(.96)}
.btn.gen-btn.pulse{animation:gpulse .45s ease-out}
@keyframes gpulse{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
.spark{position:fixed;pointer-events:none;z-index:20;font-size:14px;color:#D98C7E;transform:translate(-50%,-50%);animation:spark .65s ease-out forwards}
.spark.d{width:7px;height:7px;border-radius:50%;background:#E9C46A;font-size:0}
.spark.p{color:#C97B8E}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}}
.out.reveal{animation:reveal .4s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spark,.btn.gen-btn.pulse,.out.reveal{animation:none!important}.spark{display:none}}
</style>
</head>

function ranked(cat,ex){const tg=ptags();const sd=S.d4.seed||0;const sc=t=>t.tags.filter(x=>tg.has(x)).length+(t.f==='輪播'?0.5:0);
 return TOPICS.filter(t=>t.c===cat&&!ex.has(t.id)).sort((a,b)=>sc(b)-sc(a)||((a.id*7+sd*13)%31)-((b.id*7+sd*13)%31))}
function recommend(){const rec=[];Object.keys(QUOTA).forEach(c=>ranked(c,new Set(rec)).slice(0,QUOTA[c]).forEach(t=>rec.push(t.id)));S.d4.rec=rec;S.d4.skip=[]}
function day4(){const rec=(S.d4.rec||[]).map(T).filter(Boolean);
 return shell(4,`${needD1()}
 ${genBtn('rec',rec.length,'給我 3 個題目')}
 ${rec.length?`<div style="margin-top:6px">${rec.map((t,i)=>`<details class="tcard"><summary style="cursor:pointer;list-style:none"><div class="tt">${i+1}. ${esc(t.t)}</div><div class="tags"><span class="tag c">${CAT[t.c].n}</span><span class="tag">${t.f}</span><span class="tag">點開看重點</span></div></summary>
  <div class="tdet"><b>要講的重點：</b>${t.k.map((k,j)=>`${j+1}. ${esc(k)}`).join('　')}<br><b>結尾一句：</b>${esc(t.c==='D'?contactCTA():CAT[t.c].cta)}</div>
  <div class="tact"><button class="mini" data-act="swap" data-id="${t.id}">換一題</button></div></details>`).join('')}</div>
 <div class="note">一週發 1 題就好：<b>第 1 題明天（Day 5）就做</b>，另外兩題接下來兩週各發一篇。發完再回來按「重新產出」拿新題目。</div>`:''}`)}

/* DAY 5 */
function day5(){const rec=(S.d4.rec||[]).map(T).filter(Boolean);
 if(!rec.length)return shell(5,`<div class="note warn">請先到 Day 4 拿到你的 3 個題目。</div><button class="btn" data-act="go" data-d="4">前往 Day 4</button>`);
 const has=tx('d5o.car');
 return shell(5,`
 <label class="field"><span class="lb">1. 選一個最好拍的題目</span><select data-k="d5.id"><option value="">— 選擇 —</option>${rec.map(t=>`<option value="${t.id}"${String(getP('d5.id'))===String(t.id)?' selected':''}>${esc(t.t)}</option>`).join('')}</select><small>建議選第 1 題（建立信任），最容易被收藏。</small></label>
 ${F('2. 一句你的真實經驗或做法','d5.real',{rows:2,ph:'例如：我量尺寸會請客人每一指量兩次，取比較大的數字。'})}
 ${genBtn('gen5',has,'產出我的第一篇貼文')}
 ${has?O('7 頁輪播（每頁一句＋配圖）','d5o.car',{rows:16})+O('貼文內文','d5o.cap',{rows:8})+`<div class="note">發布前：把【請填寫】換成你的話、確認圖片裡客人的手有經過同意，就可以發了。</div>`:''}`)}
function gen5(){const t=T(getP('d5.id'));if(!t){toast('請先選一個題目');return}
 const real=tx('d5.real');const cta=t.c==='D'?contactCTA():CAT[t.c].cta;
 S.d5o.car=`P1 封面｜${t.t}\n　配圖：最能說明主題的一張實戴照\n\nP2｜這篇會講 3 件事：${t.k.join('、')}\n　配圖：品牌色底＋條列\n\n${t.k.map((k,i)=>`P${i+3}｜${k}\n　【請填寫：一句你的判斷方式或做法】\n　配圖：${['對比圖','近拍細節','實戴或步驟'][i]||'實拍'}`).join('\n\n')}\n\nP6｜我的經驗\n　${real||'【請填寫：你真實遇過的情況】'}\n　配圖：你的作品或製作過程\n\nP7｜${cta}${t.c==='D'?'':'\n　'+contactCTA()}\n　配圖：品牌色底＋帳號名稱`;
 S.d5o.cap=`${t.t}\n\n${t.k.map((k,i)=>`${i+1}. ${k}`).join('\n')}\n\n${real||'【請填寫：一兩句你自己的經驗】'}\n\n${cta}${t.c==='D'?'':'\n'+contactCTA()}\n\n${tagsLine()}`;
 save();render();toast('完成！')}

/* DAY 6 */
function steps(){const sw=getP('d6.sizeWay');
 return [['詢問',J(chList())||'【請選擇詢問方式】'],['確認尺寸',sw||'【請選擇尺寸確認方式】'],['報價與付款',or(tx('d6.price'),'價格')],['製作與出貨',or(tx('d6.lead'),'交期')],['收到配戴',or(tx('d6.ship'),'運送方式與運費')]]}
function day6(){const has=tx('d6o.flow');
 return shell(6,`
 <div class="note warn">價格、交期、運費都由你填寫，工具不會幫你假設。</div>
 ${C('1. 詢問方式','d6.channels',OPT.channels)}
 ${arr('d6.channels').includes('其他')?F('其他方式','d6.chOther',{ph:'例如：蝦皮賣場、FB 粉專'}):''}
 ${F('2. 價格','d6.price',{ph:'例如：公版 NT$___ 起／客製依款式報價'})}
 ${F('3. 多久可以出貨','d6.lead',{ph:'例如：確認後 ___ 個工作天出貨'})}
 ${C('4. 尺寸怎麼確認','d6.sizeWay',OPT.sizeWay,{multi:false})}
 ${F('5. 付款與運送','d6.ship',{ph:'例如：轉帳付款；超商取貨 NT$___'})}
 ${genBtn('gen6',has,'產出下單流程與回覆')}
 ${has?`<div class="flow">${steps().map((s,i)=>`<div class="fstep"><i>STEP ${i+1}</i><b>${esc(s[0])}</b>${esc(s[1])}</div>`).join('')}</div>
 ${O('下單流程（放進精選「購買方式」）','d6o.flow',{rows:6})}${O('回覆 1｜有人第一次來問','d6o.r1',{rows:7})}${O('回覆 2｜問價格和尺寸','d6o.r2',{rows:7})}
 ${/【請填寫/.test(tx('d6o.flow')+tx('d6o.r2'))?'<div class="note warn">還有【請填寫】，補上後按「重新產出」或直接改。</div>':''}`:''}`)}
function gen6(){if(!arr('d6.channels').length){toast('請選擇詢問方式');return}
 const s=steps();const sw=getP('d6.sizeWay');
 S.d6o.flow=s.map((x,i)=>`${'①②③④⑤'[i]} ${x[0]}｜${x[1]}`).join('\n');
 S.d6o.r1=`你好，謝謝你的詢問！\n想先了解三件事，方便幫你推薦：\n1. 想要的款式（可以附參考圖）\n2. 預計配戴的日期\n3. 知道自己的尺寸嗎？\n回覆我之後，我會再跟你確認細節。`;
 S.d6o.r2=`價格：${or(tx('d6.price'),'價格')}\n出貨時間：${or(tx('d6.lead'),'交期')}\n\n尺寸：${sw||'【請選擇尺寸確認方式】'}${sw==='客人提供指甲照片由我評估'?'\n請在自然光下把手平放拍正面，旁邊放一把尺會更準。':sw==='客人自行量測後對照尺寸表'?'\n每一指量最寬的地方，左右手分開記錄，量完傳給我幫你對照。':''}\n\n確認好尺寸再下單，戴起來最安心。`;
 save();render();toast('完成！')}

/* DAY 7 */
const CHECK=[['bio','IG 名稱與自介已貼上',()=>!!tx('d2o.bio')],['avatar','頭像已更換',()=>!!tx('d2o.bio')],['hl','3 則限動已發布並加入精選',()=>!!tx('d3o.s1')],['post','第一篇貼文已發布',()=>!!tx('d5o.car')],['flow','「訂購」精選已更新成完整流程',()=>!!tx('d6o.flow')],['reply','2 則回覆存進手機（快速回覆）',()=>!!tx('d6o.r1')]];
function day7(){const liveN=CHECK.filter(c=>getP('d7.'+c[0])).length;
 return shell(7,`
 <p style="color:var(--ink2);font-size:14px;margin:0 0 6px">到 IG 上<b>真的做完</b>才打勾。工具裡寫好 ≠ 已經發布。</p>
 <table class="cl"><tbody>${CHECK.map(([k,l,fn])=>`<tr><td><label class="check" style="margin:0"><input type="checkbox" data-k="d7.${k}"${getP('d7.'+k)?' checked':''} data-re="1"><span>${l}</span></label></td><td class="c"><span class="badge ${fn()?'y':'n'}">${fn()?'工具已準備好':'還沒做'}</span></td></tr>`).join('')}</tbody></table>
 <div class="note">已在 IG 完成 <b>${liveN} / ${CHECK.length}</b>${liveN===CHECK.length?'　全部完成，你的帳號可以開始經營了！接下來照 10 個題目，一週發 2–3 篇。':''}</div>
 <div class="gen"><button class="btn" data-act="print">列印／存成 PDF</button><button class="btn ghost" data-act="backup">備份資料</button></div>
 <small style="color:var(--mute);display:block;margin-bottom:14px">按「列印」後，印表機選「另存為 PDF」就能存成檔案。</small>
 ${card()}`)}
const cs=(t,b)=>`<div class="cs"><h4>${t}</h4>${b}</div>`;
const pre=s=>s?`<div class="pre">${esc(s)}</div>`:'<div class="empty">尚未完成</div>';
function card(){const b=B();const rec=(S.d4.rec||[]).map(T).filter(Boolean);const kw=(tx('d1o.kw')||'').split(/[、,，]/).filter(Boolean);
 return `<div class="card"><div class="ch"><div class="eyebrow">RVEA · BRAND LAUNCH CARD</div><h2>我的穿戴甲品牌啟動成果卡</h2><div style="color:var(--ink2);font-size:14px">${esc(b.name)}　・　${new Date().toLocaleDateString('zh-TW')}</div></div>
 <div class="cols">
 ${cs('品牌定位',pre(tx('d1o.pos')))}
 ${cs('品牌關鍵字',kw.length?`<div class="kw">${kw.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:pre(''))}
 ${cs('IG 名稱',pre(tx('d2o.name')))}
 ${cs('IG 自介',pre(tx('d2o.bio')))}
 ${cs('精選動態',pre(tx('d3o.s1')?'作品　/　尺寸　/　訂購':''))}
 ${cs('下單流程',pre(tx('d6o.flow')))}
 ${cs('我的 3 個題目',rec.length?`<div class="pre">${rec.map((t,i)=>`${i+1}. ${esc(t.t)}`).join('\n')}</div>`:pre(''))}
 ${cs('第一篇貼文',pre(T(getP('d5.id'))&&tx('d5o.car')?T(getP('d5.id')).t:''))}
 ${cs('啟動檢查',`<div class="pre">${CHECK.map(([k,l])=>`${getP('d7.'+k)?'■':'□'} ${l}`).join('\n')}</div>`)}
 </div><div style="text-align:center;color:var(--mute);font-size:12px;margin-top:14px;letter-spacing:.1em">RVEA · LIVE EXCLUSIVE GIFT</div></div>`}

/* AI 指令 */
function ai(n){const b=B();
 const base=`你是熟悉台灣 Instagram 與穿戴甲品牌的內容顧問，請用台灣繁體中文回答，簡潔、像真人說話。\n【我的品牌】名稱：${b.brand||'未定'}；定位：${tx('d1o.pos')||'未完成'}；款式：${J(b.styles)}；客群：${J(b.cl)}；實際提供的服務：${J(b.ft)||'未填'}\n`;
 const task={1:'請給我 3 個不同說法的一句品牌定位。',2:`請寫 3 款 IG 自介（每款 150 字元內），讓陌生人立刻知道賣什麼、特色、怎麼詢問（詢問方式：${J(b.ch)||'待補'}）。`,3:'請幫我寫 3 則 IG 限時動態文字，分別放進精選「作品、尺寸、訂購」，每則 3–5 行，新手照著貼就能發。',4:'請再給我 3 個新手用手機就能拍的具體穿戴甲 IG 發文題目，要具體到一看就想點開，不要「分享作品」這種籠統題目。',5:`請把題目「${T(getP('d5.id'))?.t||'待補'}」寫成 7 頁輪播，每頁一句話＋配圖建議。我的真實經驗：${tx('d5.real')||'待補'}`,6:`請依我的資料寫 2 則私訊回覆（第一次詢問、問價格和尺寸）：價格 ${tx('d6.price')||'待補'}；交期 ${tx('d6.lead')||'待補'}；尺寸 ${getP('d6.sizeWay')||'待補'}`,7:`請用第一次看到我帳號的客人角度，指出我的自介哪裡看不懂、要改哪一句：\n${tx('d2o.bio')||'待補'}`}[n];
 return base+'\n【任務】'+task+'\n\n【規則】只用我給的真實資訊，不足的地方標【待補】；不要編造特色、價格、評價或訂單；不承諾銷量或粉絲數。'}

/* 渲染與事件 */
const VIEWS={1:day1,2:day2,3:day3,4:day4,5:day5,6:day6,7:day7};
const cur=()=>{const m=location.hash.match(/day(\d)/);return m?+m[1]:0};
function render(keep=true){const y=scrollY;const n=cur();document.getElementById('app').innerHTML=n&&VIEWS[n]?VIEWS[n]():home();document.querySelectorAll('[data-cnt]').forEach(updCnt);if(keep)scrollTo(0,y)}
function go(n){location.hash=n?'day'+n:''}
addEventListener('hashchange',()=>{render(false);scrollTo(0,0)});
function updCnt(el){const l=len(getP(el.dataset.cnt)||'');const mx=+el.dataset.max;el.textContent=`${l} / ${mx}`;el.classList.toggle('over',l>mx)}
function celebrate(act){
 const btn=app.querySelector(`.gen-btn[data-act="${act}"]`);
 app.querySelectorAll('.out').forEach((o,i)=>{o.style.animationDelay=(i*60)+'ms';o.classList.add('reveal')});
 if(!btn||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 btn.classList.remove('pulse');void btn.offsetWidth;btn.classList.add('pulse');
 const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<14;i++){const e=document.createElement('span');const k=i%3;e.className='spark'+(k===1?' d':k===2?' p':'');e.textContent=k===1?'':(i%2?'✦':'✧');
  const a=(Math.PI*2*i/14)+Math.random()*.4,d=50+Math.random()*40;
  e.style.left=cx+'px';e.style.top=cy+'px';e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+'px');e.style.setProperty('--r',(Math.random()*180-90)+'deg');
  document.body.appendChild(e);setTimeout(()=>e.remove(),700)}
}
const app=document.getElementById('app');
app.addEventListener('input',e=>{const el=e.target;const k=el.dataset.k;if(!k)return;
 if(el.type==='checkbox'){setP(k,el.checked);if(el.dataset.re)render();return}
 setP(k,el.value);const c=app.querySelector(`[data-cnt="${k}"]`);if(c)updCnt(c)});
app.addEventListener('click',e=>{
 const chip=e.target.closest('[data-chip]');
 if(chip){const p=chip.dataset.chip,v=chip.dataset.v,multi=chip.dataset.multi==='1',mx=+chip.dataset.max;
  if(multi){let a=arr(p).slice();if(a.includes(v))a=a.filter(x=>x!==v);else{if(mx&&a.length>=mx){toast(`最多選 ${mx} 個，先取消一個`);return}a.push(v)}setP(p,a)}else setP(p,getP(p)===v?'':v);
  render();return}
 const cp=e.target.closest('[data-copy]');if(cp){copyText(getP(cp.dataset.copy)||'');return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='go')return go(+a.dataset.d);if(act==='home')return go(0);
 const GEN={gen1,gen2,gen3,gen5,gen6};if(GEN[act]){const before=JSON.stringify(S);GEN[act]();if(JSON.stringify(S)!==before)celebrate(act);return}
 if(act==='v2'){const x=bios();if(a.dataset.w==='name'){S.d2.vn=((S.d2.vn||0)+1)%3;S.d2o.name=x.names[S.d2.vn]}else{S.d2.vb=((S.d2.vb||0)+1)%3;S.d2o.bio=x.bios[S.d2.vb]}save();render();return}
 if(act==='rec'){if(!arr('d1.styles').length){toast('請先完成 Day 1');return}S.d4.seed=(S.d4.seed||0)+((S.d4.rec||[]).length?1:0);recommend();save();render();celebrate('rec');toast('這是你的 3 個題目');return}
 if(act==='swap'){const id=+a.dataset.id;const t=T(id);const nx=ranked(t.c,new Set([...S.d4.rec,...(S.d4.skip||[])]))[0];if(!nx){toast('這類沒有其他題目了');return}S.d4.rec=S.d4.rec.map(x=>x===id?nx.id:x);S.d4.skip=[...(S.d4.skip||[]),id];save();render();toast('已換一題');return}
 if(act==='ai'){copyText(ai(+a.dataset.d));return}
 if(act==='print'){document.getElementById('printArea').innerHTML=card();print();return}
 if(act==='backup'){const d=new Date();download(`RVEA_7天啟動包_備份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`,JSON.stringify({app:'rvea-7day-lite',v:1,data:S},null,2),'application/json');toast('已下載備份檔');return}
 if(act==='restore'){document.getElementById('restoreFile').click();return}
 if(act==='reset'){if(confirm('確定清除所有資料？建議先備份，清除後無法復原。')){S=blank();save();go(0);render()}return}
});
app.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.k){setP(el.dataset.k,el.value)}});
document.getElementById('restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=='rvea-7day-lite'||typeof j.data!=='object')throw 0;if(!confirm('還原會取代目前的資料，確定嗎？'))return;S=Object.assign(blank(),j.data);save();render();toast('已還原')}catch(err){toast('這不是啟動包的備份檔')}e.target.value=''};r.readAsText(f)});
addEventListener('beforeprint',()=>{document.getElementById('printArea').innerHTML=card()});
render(false);
</script>
